<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="mark_sheet.html">Marksheet</a>
    <a href="resume.html">Resume</a>
    <a href="restaurant.html">Restaurant</a>
    <a href="registration.html">Registration</a>
    <a href="login.html">Login</a>
</nav>

<div class="container">

    <h1>Registration Form</h1>

    <form action="#" method="post">

        <!-- Text -->
        <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <!-- Radio Buttons -->
        <div class="form-group">
            <label>Gender:</label>

            <div class="radio-group">
                <label for="male">
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="male"
                    >
                    Male
                </label>

                <label for="female">
                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="female"
                    >
                    Female
                </label>

                <label for="other">
                    <input
                        type="radio"
                        id="other"
                        name="gender"
                        value="other"
                    >
                    Other
                </label>
            </div>
        </div>

        <!-- Dropdown -->
        <div class="form-group">
            <label for="course">Select Course:</label>

            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="mca">MCA</option>
                <option value="bba">BBA</option>
                <option value="mba">MBA</option>
            </select>
        </div>

        <!-- Checkboxes -->
        <div class="form-group">
            <label>Skills:</label>

            <div class="checkbox-group">
                <label for="html">
                    <input
                        type="checkbox"
                        id="html"
                        name="skills"
                        value="html"
                    >
                    HTML
                </label>

                <label for="css">
                    <input
                        type="checkbox"
                        id="css"
                        name="skills"
                        value="css"
                    >
                    CSS
                </label>

                <label for="javascript">
                    <input
                        type="checkbox"
                        id="javascript"
                        name="skills"
                        value="javascript"
                    >
                    JavaScript
                </label>

                <label for="python">
                    <input
                        type="checkbox"
                        id="python"
                        name="skills"
                        value="python"
                    >
                    Python
                </label>
            </div>
        </div>

        <!-- Submit -->
        <button type="submit">Register</button>

    </form>

</div>

<footer>
    Registration Page
</footer>

</body>
</html>
